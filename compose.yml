version: "3.9"

services:
  devopsdb:
    image: appimage
    ports:
      - "3306:3306"
    environments:
      MYSQL_ROOT_PASSWORD: devopspassword
    deploy:
      replicas: 1
    volumes:
      - dbvolume:/var/lib/mysql
    networks:
      - mynetwork

  application:
    image: databaseimage
    ports:
      - "1111:8080"
    deploy:
      replicas: 1
    depends_on:
      - devopsdb
    networks:
      - mynetwork

volumes:
  dbvolume:
networks:
  mynetwork:
    driver: overlay
